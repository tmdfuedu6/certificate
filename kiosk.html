<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#003462">
<title>수료증 발급</title>
<style>
  @font-face { font-family: "Pretendard"; src: url(fonts/Pretendard-Regular.woff2) format("woff2"); font-display: block; }
  :root {
    --navy: #003462; --blue: #009ADB; --lime: #C3D600;
    --ink: #1D1B1B; --sub: #5B6470; --line: #DDE2E8; --bg: #F3F5F8; --card: #FFFFFF; --warn: #B42318;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "Pretendard", system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
  .bar { height: 6px; background: linear-gradient(90deg, var(--navy) 0 33.3%, var(--blue) 33.3% 66.6%, var(--lime) 66.6%); }

  /* 모바일 기준 단일 컬럼 — 큰 화면에서는 가운데 정렬만 */
  .page { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  header h1 { margin: 4px 0 0; font-size: 20px; color: var(--navy); letter-spacing: -0.4px; text-align: center; }
  .warn { padding: 10px 12px; border-radius: 10px; background: #FEF3F2; color: var(--warn); font-size: 13px; line-height: 1.5; display: none; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 16px; box-shadow: 0 2px 10px rgba(0, 30, 70, .06); }

  .preview { padding: 10px; }
  .preview canvas { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--line); }

  label { display: block; font-size: 14px; color: var(--sub); margin-bottom: 6px; }
  .field + .field { margin-top: 14px; }
  input[type=text], input[type=date] {
    width: 100%; height: 54px; font: inherit; font-size: 18px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px;
    outline: none; color: var(--ink); background: #fff; -webkit-appearance: none; appearance: none;
  }
  input:focus { border-color: var(--blue); }
  button { font: inherit; border: 0; border-radius: 12px; cursor: pointer; width: 100%; height: 56px; font-size: 18px; }
  .primary { background: var(--navy); color: #fff; margin-top: 18px; }
  .primary:disabled { background: #9AA6B2; cursor: default; }
  .secondary { background: var(--bg); color: var(--navy); }

  .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .qr-title { font-size: 18px; color: var(--navy); margin: 0; }
  #qr { padding: 12px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; }
  #qr img, #qr canvas { display: block; }
  .qr-name { font-size: 16px; color: var(--sub); margin: 0; }
  .timer { font-size: 13px; color: var(--sub); }

  /* 주의사항: 페이지 최하단 */
  footer { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  footer ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.7; color: var(--sub); }
  [hidden] { display: none !important; }

  /* 위치 보정 모드 */
  .calib { display: grid; grid-template-columns: 84px 1fr 48px; gap: 6px 8px; align-items: center; font-size: 13px; }
  .calib h3 { grid-column: 1 / -1; margin: 8px 0 0; font-size: 14px; color: var(--navy); }
  .calib input { width: 100%; }
  .calib output { text-align: right; font-variant-numeric: tabular-nums; }
  .calib textarea { grid-column: 1 / -1; font: 11px/1.4 ui-monospace, monospace; height: 100px; }
</style>
</head>
<body>
<div class="bar"></div>
<div class="page">
  <header><h1>MSW 크리에이터 스쿨 수료증 발급</h1></header>
  <div class="warn" id="warn"></div>

  <!-- 1단계: 입력 + 미리보기 -->
  <form class="card" id="form" autocomplete="off">
    <div class="field">
      <label for="name">성함</label>
      <input type="text" id="name" maxlength="20" autocomplete="off" spellcheck="false" placeholder="학생 이름 입력" enterkeyhint="done">
    </div>
    <div class="field">
      <label for="date">발급 날짜</label>
      <input type="date" id="date">
    </div>
    <button type="submit" class="primary" id="issue" disabled>QR 발급</button>
  </form>

  <section class="card preview" id="previewCard"><canvas id="preview" aria-label="수료증 미리보기"></canvas></section>

  <!-- 2단계: QR -->
  <section class="card qr-wrap" id="qrView" hidden>
    <p class="qr-title">휴대폰 카메라로 QR을 찍어주세요</p>
    <div id="qr"></div>
    <p class="qr-name" id="qrName"></p>
    <button type="button" class="secondary" id="next">다음 학생</button>
    <span class="timer" id="timer"></span>
  </section>

  <!-- 위치 보정 모드 (?calibrate=1) -->
  <section class="card calib" id="calib" hidden></section>

  <footer>
    <ul>
      <li>입력한 이름은 이 기기·서버 어디에도 저장되지 않습니다.</li>
      <li>QR은 발급 후 30분 동안만 열립니다.</li>
      <li>QR 화면은 3분 뒤 자동으로 초기화됩니다.</li>
    </ul>
  </footer>
</div>

<script src="qrcode.min.js"></script>
<script src="certificate.js"></script>
<script>
(function () {
  'use strict';
  var RESET_SECONDS = 180;

  var $ = function (id) { return document.getElementById(id); };
  var form = $('form'), nameEl = $('name'), dateEl = $('date'), issueBtn = $('issue');
  var qrView = $('qrView'), qrBox = $('qr'), qrName = $('qrName'), timerEl = $('timer');
  var canvas = $('preview'), previewCard = $('previewCard');
  var calibrate = new URLSearchParams(location.search).get('calibrate') === '1';
  var countdown = null;

  dateEl.value = Certificate.todayISO();

  // 학생 폰이 열 수 없는 주소면 경고
  var host = location.hostname;
  if (location.protocol === 'file:' || host === 'localhost' || host === '127.0.0.1') {
    var w = $('warn');
    w.textContent = '지금 주소(' + (location.protocol === 'file:' ? '내 PC 파일' : host) + ')는 학생 휴대폰에서 열리지 않습니다. 배포된 주소에서 실행해야 QR이 동작합니다.';
    w.style.display = 'block';
  }

  function certUrl(token) {
    var u = new URL('cert.html', location.href);
    u.search = '';
    u.hash = 'd=' + token;
    return u.href;
  }

  function draw() {
    var name = nameEl.value.trim();
    if (calibrate && !name) name = '김넥슨';
    return Certificate.render(canvas, name, dateEl.value);
  }

  function updateButton() {
    issueBtn.disabled = !nameEl.value.trim() || !dateEl.value;
  }

  nameEl.addEventListener('input', function () { updateButton(); draw(); });
  dateEl.addEventListener('input', function () { updateButton(); draw(); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nameEl.value.trim();
    if (!name || !dateEl.value) return;
    qrBox.innerHTML = '';
    // 화면 폭에 맞춘 QR 크기 (카드·QR 여백 제외, 최대 300)
    var size = Math.max(200, Math.min(300, document.querySelector('.page').clientWidth - 92));
    new QRCode(qrBox, {
      text: certUrl(Certificate.encode(name, dateEl.value)),
      width: size, height: size,
      correctLevel: QRCode.CorrectLevel.M
    });
    qrName.textContent = name + ' · ' + Certificate.formatDate(dateEl.value);
    nameEl.blur(); // 모바일 키보드 닫기
    previewCard.hidden = true;
    form.hidden = true;
    qrView.hidden = false;
    window.scrollTo(0, 0);
    startCountdown();
  });

  function startCountdown() {
    var left = RESET_SECONDS;
    timerEl.textContent = left + '초 후 자동으로 초기화됩니다';
    clearInterval(countdown);
    countdown = setInterval(function () {
      left -= 1;
      if (left <= 0) return reset();
      timerEl.textContent = left + '초 후 자동으로 초기화됩니다';
    }, 1000);
  }

  // 화면에서 이름 흔적을 모두 지운다 (날짜는 유지 — 같은 반은 같은 날짜로 연속 발급)
  function reset() {
    clearInterval(countdown);
    countdown = null;
    qrBox.innerHTML = '';
    qrName.textContent = '';
    nameEl.value = '';
    qrView.hidden = true;
    previewCard.hidden = false;
    form.hidden = false;
    updateButton();
    draw();
    nameEl.focus();
  }

  $('next').addEventListener('click', reset);

  // ---- 위치 보정 모드 ----
  function setupCalibration() {
    var box = $('calib');
    box.hidden = false;
    var L = { 이름: Certificate.NAME_LAYOUT, 날짜: Certificate.DATE_LAYOUT };
    var fields = [['x', 0, 1787], ['centerY', 0, 2527], ['size', 20, 120], ['letterSpacing', -10, 10]];
    var html = '';
    Object.keys(L).forEach(function (k) {
      html += '<h3>' + k + '</h3>';
      fields.forEach(function (f) {
        var id = k + '-' + f[0];
        html += '<span>' + f[0] + '</span><input type="range" id="' + id + '" min="' + f[1] + '" max="' + f[2] + '" step="0.5" value="' + L[k][f[0]] + '"><output id="' + id + '-o">' + L[k][f[0]] + '</output>';
      });
    });
    html += '<textarea id="calibOut" readonly></textarea>';
    box.innerHTML = html;

    function sync() {
      Object.keys(L).forEach(function (k) {
        fields.forEach(function (f) {
          var v = parseFloat($(k + '-' + f[0]).value);
          L[k][f[0]] = v;
          $(k + '-' + f[0] + '-o').textContent = v;
        });
      });
      $('calibOut').value = '// certificate.js 에 붙여넣기\nNAME_LAYOUT: ' + JSON.stringify(pick(L.이름)) + '\nDATE_LAYOUT: ' + JSON.stringify(pick(L.날짜));
      draw();
    }
    function pick(o) { return { x: o.x, centerY: o.centerY, size: o.size, letterSpacing: o.letterSpacing }; }
    box.addEventListener('input', sync);
    sync();
  }

  if (calibrate) setupCalibration();

  draw().catch(function (err) {
    var w = $('warn');
    w.textContent = err.message;
    w.style.display = 'block';
  });
})();
</script>
</body>
</html>
