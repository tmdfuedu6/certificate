<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>수료증 발급</title>
<style>
  @font-face { font-family: "Pretendard"; src: url(fonts/Pretendard-Regular.woff2) format("woff2"); font-display: block; }
  :root {
    --navy: #003462; --blue: #009ADB; --lime: #C3D600;
    --ink: #1D1B1B; --sub: #5B6470; --line: #DDE2E8; --bg: #F3F5F8; --card: #FFFFFF; --warn: #B42318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Pretendard", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  .bar { height: 8px; background: linear-gradient(90deg, var(--navy) 0 33.3%, var(--blue) 33.3% 66.6%, var(--lime) 66.6%); }
  header { padding: 18px 28px 0; display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 26px; color: var(--navy); letter-spacing: -0.5px; }
  header span { color: var(--sub); font-size: 15px; }
  .warn { margin: 12px 28px 0; padding: 10px 14px; border-radius: 10px; background: #FEF3F2; color: var(--warn); font-size: 14px; display: none; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 28px; padding: 20px 28px 28px; height: calc(100% - 70px); }
  .preview { display: flex; align-items: center; justify-content: center; min-height: 0; }
  .preview canvas { max-width: 100%; max-height: calc(100vh - 150px); box-shadow: 0 6px 24px rgba(0, 30, 70, .14); background: #fff; }
  .panel { background: var(--card); border-radius: 18px; padding: 28px; box-shadow: 0 2px 10px rgba(0, 30, 70, .06); display: flex; flex-direction: column; gap: 18px; align-self: start; }
  label { display: block; font-size: 15px; color: var(--sub); margin-bottom: 8px; }
  input[type=text], input[type=date] {
    width: 100%; font: inherit; font-size: 28px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; outline: none; color: var(--ink); background: #fff;
  }
  input:focus { border-color: var(--blue); }
  button { font: inherit; border: 0; border-radius: 12px; cursor: pointer; }
  .primary { background: var(--navy); color: #fff; font-size: 24px; padding: 18px; }
  .primary:disabled { background: #9AA6B2; cursor: default; }
  .secondary { background: var(--bg); color: var(--navy); font-size: 20px; padding: 16px; }
  .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  #qr { padding: 14px; background: #fff; border: 2px solid var(--line); border-radius: 14px; }
  #qr img, #qr canvas { display: block; }
  .qr-title { font-size: 22px; color: var(--navy); margin: 0; }
  .qr-name { font-size: 18px; color: var(--sub); margin: 0; }
  .timer { font-size: 15px; color: var(--sub); }
  .note { font-size: 13px; color: var(--sub); line-height: 1.5; margin: 0; }
  [hidden] { display: none !important; }

  /* 위치 보정 모드 */
  .calib { display: grid; grid-template-columns: 70px 1fr 56px; gap: 6px 10px; align-items: center; font-size: 14px; }
  .calib h3 { grid-column: 1 / -1; margin: 8px 0 0; font-size: 15px; color: var(--navy); }
  .calib output { text-align: right; font-variant-numeric: tabular-nums; }
  .calib textarea { grid-column: 1 / -1; font: 12px/1.4 ui-monospace, monospace; height: 110px; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    .preview canvas { max-height: 50vh; }
    .panel { align-self: stretch; }
  }
</style>
</head>
<body>
<div class="bar"></div>
<header><h1>MSW 크리에이터 스쿨 수료증 발급</h1><span>이름은 저장되지 않습니다</span></header>
<div class="warn" id="warn"></div>

<main>
  <section class="preview"><canvas id="preview" aria-label="수료증 미리보기"></canvas></section>

  <section class="panel">
    <!-- 1단계: 입력 -->
    <form id="form" autocomplete="off">
      <div style="margin-bottom:18px">
        <label for="name">성함</label>
        <input type="text" id="name" maxlength="20" autocomplete="off" spellcheck="false" placeholder="학생 이름 입력">
      </div>
      <div style="margin-bottom:22px">
        <label for="date">발급 날짜</label>
        <input type="date" id="date">
      </div>
      <button type="submit" class="primary" id="issue" style="width:100%" disabled>QR 발급</button>
    </form>

    <!-- 2단계: QR -->
    <div class="qr-wrap" id="qrView" hidden>
      <p class="qr-title">휴대폰 카메라로 QR을 찍어주세요</p>
      <div id="qr"></div>
      <p class="qr-name" id="qrName"></p>
      <button type="button" class="secondary" id="next" style="width:100%">다음 학생</button>
      <span class="timer" id="timer"></span>
      <p class="note">QR은 발급 후 30분 동안만 열립니다.<br>이름은 이 기기·서버 어디에도 저장되지 않습니다.</p>
    </div>

    <!-- 위치 보정 모드 (?calibrate=1) -->
    <div class="calib" id="calib" hidden></div>
  </section>
</main>

<script src="qrcode.min.js"></script>
<script src="certificate.js"></script>
<script>
(function () {
  'use strict';
  var RESET_SECONDS = 180;

  var $ = function (id) { return document.getElementById(id); };
  var form = $('form'), nameEl = $('name'), dateEl = $('date'), issueBtn = $('issue');
  var qrView = $('qrView'), qrBox = $('qr'), qrName = $('qrName'), timerEl = $('timer');
  var canvas = $('preview');
  var calibrate = new URLSearchParams(location.search).get('calibrate') === '1';
  var countdown = null;

  dateEl.value = Certificate.todayISO();

  // 학생 폰이 열 수 없는 주소면 경고
  var host = location.hostname;
  if (location.protocol === 'file:' || host === 'localhost' || host === '127.0.0.1') {
    var w = $('warn');
    w.textContent = '지금 주소(' + (location.protocol === 'file:' ? '내 PC 파일' : host) + ')는 학생 휴대폰에서 열리지 않습니다. 배포된 주소에서 실행해야 QR이 동작합니다.';
    w.style.display = 'block';
  }

  function certUrl(token) {
    var u = new URL('cert.html', location.href);
    u.search = '';
    u.hash = 'd=' + token;
    return u.href;
  }

  function draw() {
    var name = nameEl.value.trim();
    if (calibrate && !name) name = '김넥슨';
    return Certificate.render(canvas, name, dateEl.value);
  }

  function updateButton() {
    issueBtn.disabled = !nameEl.value.trim() || !dateEl.value;
  }

  nameEl.addEventListener('input', function () { updateButton(); draw(); });
  dateEl.addEventListener('input', function () { updateButton(); draw(); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nameEl.value.trim();
    if (!name || !dateEl.value) return;
    qrBox.innerHTML = '';
    new QRCode(qrBox, {
      text: certUrl(Certificate.encode(name, dateEl.value)),
      width: 300, height: 300,
      correctLevel: QRCode.CorrectLevel.M
    });
    qrName.textContent = name + ' · ' + Certificate.formatDate(dateEl.value);
    form.hidden = true;
    qrView.hidden = false;
    startCountdown();
  });

  function startCountdown() {
    var left = RESET_SECONDS;
    timerEl.textContent = left + '초 후 자동으로 초기화됩니다';
    clearInterval(countdown);
    countdown = setInterval(function () {
      left -= 1;
      if (left <= 0) return reset();
      timerEl.textContent = left + '초 후 자동으로 초기화됩니다';
    }, 1000);
  }

  // 화면에서 이름 흔적을 모두 지운다 (날짜는 유지 — 같은 반은 같은 날짜로 연속 발급)
  function reset() {
    clearInterval(countdown);
    countdown = null;
    qrBox.innerHTML = '';
    qrName.textContent = '';
    nameEl.value = '';
    qrView.hidden = true;
    form.hidden = false;
    updateButton();
    draw();
    nameEl.focus();
  }

  $('next').addEventListener('click', reset);

  // ---- 위치 보정 모드 ----
  function setupCalibration() {
    var box = $('calib');
    box.hidden = false;
    var L = { 이름: Certificate.NAME_LAYOUT, 날짜: Certificate.DATE_LAYOUT };
    var fields = [['x', 0, 1787], ['centerY', 0, 2527], ['size', 20, 120], ['letterSpacing', -10, 10]];
    var html = '';
    Object.keys(L).forEach(function (k) {
      html += '<h3>' + k + '</h3>';
      fields.forEach(function (f) {
        var id = k + '-' + f[0];
        html += '<span>' + f[0] + '</span><input type="range" id="' + id + '" min="' + f[1] + '" max="' + f[2] + '" step="0.5" value="' + L[k][f[0]] + '"><output id="' + id + '-o">' + L[k][f[0]] + '</output>';
      });
    });
    html += '<textarea id="calibOut" readonly></textarea>';
    box.innerHTML = html;

    function sync() {
      Object.keys(L).forEach(function (k) {
        fields.forEach(function (f) {
          var v = parseFloat($(k + '-' + f[0]).value);
          L[k][f[0]] = v;
          $(k + '-' + f[0] + '-o').textContent = v;
        });
      });
      $('calibOut').value = '// certificate.js 에 붙여넣기\nNAME_LAYOUT: ' + JSON.stringify(pick(L.이름)) + '\nDATE_LAYOUT: ' + JSON.stringify(pick(L.날짜));
      draw();
    }
    function pick(o) { return { x: o.x, centerY: o.centerY, size: o.size, letterSpacing: o.letterSpacing }; }
    box.addEventListener('input', sync);
    sync();
  }

  if (calibrate) setupCalibration();

  draw().catch(function (err) {
    var w = $('warn');
    w.textContent = err.message;
    w.style.display = 'block';
  });
  nameEl.focus();
})();
</script>
</body>
</html>
